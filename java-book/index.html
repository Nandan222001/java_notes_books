<body>

<div id="loader"><div class="cup">☕</div><p>Binding your book…</p></div>

<header id="toolbar">
  <div class="tb-brand"><span class="logo">☕</span> <b>Java</b><i>·Zero→FAANG</i></div>
  <div class="tb-search">
    <input id="searchBox" type="text" placeholder="Search the book…  ( / )" autocomplete="off">
    <div id="searchResults" hidden></div>
  </div>
  <div class="tb-actions">
    <button id="btnToc" title="Contents (T)">☰ <span class="lbl">Contents</span></button>
    <button id="btnBm" title="Bookmarks (B)">🔖<span id="bmCount" class="cnt"></span></button>

    <button id="btnTheme" title="Night reading (N)">🌙</button>
    <button id="btnFs" title="Fullscreen (F)">⛶</button>
  </div>
</header>

<main id="stage">
  <div id="bookWrap">
    <div id="bookPan"><div id="book"></div></div>
    <div class="spine-overlay"></div>
    <button id="hsPrev" class="hotspot hs-left" aria-label="Previous page">‹</button>
    <button id="hsNext" class="hotspot hs-right" aria-label="Next page">›</button>
  </div>
</main>

<footer id="bottombar">
  <button id="btnMark" title="Bookmark this spread">☆ Mark</button>
  <button id="btnPrev" class="navbtn">‹ Prev</button>
  <div id="progressWrap">
    <input type="range" id="scrubber" min="0" max="1" step="1" value="0" aria-label="Jump to any spread">
    <span id="pageLabel">Cover</span>
  </div>
  <button id="btnNext" class="navbtn">Next ›</button>
</footer>

<aside id="tocDrawer" aria-label="Table of contents">
  <div class="dr-head"><h3>📖 Contents</h3><button id="drClose" aria-label="Close contents">✕</button></div>
  <div id="tocList"></div>
  <div class="dr-bm"><h4>🔖 Bookmarked spreads</h4><div id="bmList"><em>No bookmarks yet — press ☆ Mark while reading.</em></div></div>
</aside>

<div id="toastZone" aria-live="polite"></div>
